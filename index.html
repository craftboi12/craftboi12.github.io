<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pocket Metropolis</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#10262e;--panel:#12303bee;--chip:#1d4756;--text:#eef6f3;--mute:#9fc2c4;--gold:#f2b134;--bad:#ff7b6b;--good:#7bdc9a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#0a1a20;--panel:#0b1d24ee;--chip:#12303b}}
:root[data-theme="dark"]{--ink:#0a1a20;--panel:#0b1d24ee;--chip:#12303b}
html,body{height:100%;margin:0;background:var(--ink)}
body{position:relative;font-family:Nunito,system-ui,sans-serif;color:var(--text);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.panel{position:absolute;background:var(--panel);border-radius:14px;padding:8px 12px}
#top{top:8px;left:8px;right:8px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-weight:800;font-size:15px}
#top .s small{display:block;color:var(--mute);font-weight:600;font-size:11px}
#top .bad{color:var(--bad)}#top .good{color:var(--good)}
#btns{margin-left:auto;display:flex;gap:6px}
#btns button{background:var(--chip);color:var(--text);border:0;border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;cursor:pointer}
#dem{top:calc(100% - 0px);position:absolute}
#bar{left:8px;right:8px;bottom:8px;display:flex;gap:6px;overflow-x:auto;padding:8px}
.tb{flex:0 0 auto;min-width:64px;background:var(--chip);color:var(--text);border:2px solid transparent;border-radius:10px;padding:6px 8px;font:inherit;font-weight:800;font-size:13px;cursor:pointer;text-align:center}
.tb i{display:block;height:8px;border-radius:4px;margin-bottom:5px}
.tb small{display:block;color:var(--mute);font-weight:600;font-size:11px}
.tb.on{border-color:var(--gold)}
#tip{left:8px;bottom:92px;font-size:13px;font-weight:600;padding:6px 10px;max-width:70%}
#dm{right:8px;top:74px;width:130px;font-size:12px;font-weight:800}
#dm div{margin:3px 0}#dm span{display:block;height:7px;background:var(--chip);border-radius:4px;overflow:hidden;margin-top:2px;position:relative}
#dm b{position:absolute;top:0;bottom:0;border-radius:4px}
#toast{left:50%;top:80px;transform:translateX(-50%);opacity:0;transition:opacity .2s;pointer-events:none;font-weight:800;font-size:14px;color:var(--gold)}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
body{overscroll-behavior:none;-webkit-touch-callout:none}
#top{top:6px;left:6px;right:6px;gap:4px 12px;font-size:13px;padding:6px 10px}
#top .s small{font-size:10px}
#top .s:nth-child(5){display:none}
#btns button{padding:8px 10px;min-height:36px}
#bar{left:6px;right:6px;bottom:6px;padding:6px;gap:6px;scrollbar-width:none}
#bar::-webkit-scrollbar{display:none}
.tb{min-width:62px;min-height:62px;padding:6px;font-size:11px;border-radius:12px}
.tb em{display:block;font-style:normal;font-size:22px;line-height:26px}
.tb small{font-size:10px}
#dm{top:auto;right:auto;left:6px;bottom:96px;width:auto;display:flex;gap:8px;padding:6px 10px;font-size:11px;pointer-events:none}
#dm div{margin:0;width:56px}
#tip{top:56px;bottom:auto;left:50%;transform:translateX(-50%);width:max-content;max-width:88%;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
#tip.show{opacity:1}
#toast{top:110px}
#zoom{right:6px;bottom:96px;display:flex;flex-direction:column;gap:6px;padding:6px}
#zoom button{width:42px;height:42px;background:var(--chip);color:var(--text);border:0;border-radius:10px;font:inherit;font-size:22px;font-weight:800}
.tb.lock{opacity:.45}
#toast{width:max-content;max-width:90%;text-align:center}
#cr{position:absolute;inset:0;background:rgba(5,15,20,.6);display:none;align-items:center;justify-content:center;z-index:5}
#cr.show{display:flex}
#cr .box{background:var(--panel);border-radius:16px;padding:18px 22px;width:min(320px,86%);text-align:center}
#cr h2{margin:0 0 12px;font-size:20px;color:var(--gold)}
#cr p{margin:10px 0;font-weight:800;font-size:16px}
#cr p small{display:block;color:var(--mute);font-weight:600;font-size:12px;margin-top:2px}
#cr button{margin-top:8px;background:var(--chip);color:var(--text);border:0;border-radius:8px;padding:9px 18px;min-height:40px;font:inherit;font-weight:800;cursor:pointer}
#sv{position:absolute;inset:0;background:rgba(5,15,20,.6);display:none;align-items:center;justify-content:center;z-index:5}
#sv.show{display:flex}
#sv .box{background:var(--panel);border-radius:16px;padding:16px 18px;width:min(340px,90%);text-align:center;max-height:90%;overflow:auto;touch-action:pan-y}
#sv h2{margin:0 0 8px;font-size:20px;color:var(--gold)}
#sv small{display:block;color:var(--mute);font-weight:600;font-size:12px;margin:4px 0 8px}
#sv button,.fl{display:inline-block;margin:4px;background:var(--chip);color:var(--text);border:0;border-radius:8px;padding:9px 14px;min-height:40px;font:inherit;font-size:14px;font-weight:800;cursor:pointer;box-sizing:border-box}
.fl input{display:none}
#sv textarea{width:100%;box-sizing:border-box;background:var(--ink);color:var(--text);border:1px solid var(--chip);border-radius:8px;padding:6px;font:12px monospace;margin-top:6px;resize:none;user-select:text;-webkit-user-select:text}
#hap{border-bottom:1px dotted var(--mute);cursor:pointer}
#hp{position:absolute;inset:0;background:rgba(5,15,20,.6);display:none;align-items:center;justify-content:center;z-index:5}
#hp.show{display:flex}
#hp .box{background:var(--panel);border-radius:16px;padding:16px 18px;width:min(360px,92%);max-height:88%;overflow:auto;touch-action:pan-y}
#hp h2{margin:0 0 6px;font-size:19px;color:var(--gold)}
#hpw{font-size:13px;font-weight:700;margin:6px 0 10px;line-height:1.4}
.hr{display:flex;justify-content:space-between;font-weight:800;font-size:14px;padding:4px 0}
.hr b.neg{color:var(--bad)}.hr b.pos{color:var(--good)}
.hh{color:var(--mute);font-size:12px;font-weight:600;margin:-2px 0 4px}
#hp button{margin-top:8px;background:var(--chip);color:var(--text);border:0;border-radius:8px;padding:9px 18px;min-height:40px;font:inherit;font-weight:800;cursor:pointer}
#mn{position:absolute;inset:0;background:#17414f;z-index:4;display:none;align-items:center;justify-content:center;overflow:auto}
#mn.show{display:flex}
.mc{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px;width:100%;max-width:420px;box-sizing:border-box}
.mc .art{width:min(70vw,38vh);height:auto}
.mc h1{margin:4px 0 0;font-size:clamp(26px,7vw,38px);font-weight:800;color:#eef6f3;text-align:center}
.mc .tg{margin:0 0 6px;color:#9fc2c4;font-weight:600;font-size:14px;text-align:center}
#mni{color:#9fc2c4;font-weight:700;font-size:14px;min-height:18px;text-align:center}
#mn button{width:min(280px,80vw);min-height:50px;border:0;border-radius:12px;font:inherit;font-weight:800;font-size:17px;background:#1d4756;color:#eef6f3;cursor:pointer}
#mn button.pri,#nw button.pri{background:#f2b134;color:#10262e}
#mn #mnb{background:transparent;color:#9fc2c4;min-height:40px;font-size:14px}
#cn{max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#nw{position:absolute;inset:0;background:rgba(5,15,20,.6);display:none;align-items:center;justify-content:center;z-index:5}
#nw.show{display:flex}
#nw .box{background:var(--panel);border-radius:16px;padding:16px 18px;width:min(340px,92%);text-align:center;max-height:92%;overflow:auto;touch-action:pan-y}
#nw h2{margin:0 0 8px;font-size:20px;color:var(--gold)}
#nw input{width:100%;box-sizing:border-box;background:var(--ink);color:var(--text);border:1px solid var(--chip);border-radius:8px;padding:10px;font:inherit;font-weight:800;font-size:16px;user-select:text;-webkit-user-select:text}
#nw .row{display:flex;gap:6px;margin:8px 0}
#nw .row button{flex:1}
#nw button{background:var(--chip);color:var(--text);border:2px solid transparent;border-radius:10px;padding:8px 6px;min-height:44px;font:inherit;font-weight:800;font-size:14px;cursor:pointer}
#nw button.on{border-color:var(--gold)}
#nw small{display:block;color:var(--mute);font-weight:600;font-size:11px}
#nwm{color:var(--gold);font-weight:700;font-size:12px;margin:6px 0;min-height:16px;line-height:1.35}
</style></head><body>

function newGame(sz,name){

 var axis=ri(0,1),row=(N>>1)+ri(-3,3),sh=(N-32)>>1,fl=rnd()<.5?1:-1;

 if(!tg||!tg.CloudStorage||!inGame||Date.now()-clT<15000)return;clT=Date.now();

 if(!tg||!tg.CloudStorage){done();return}

function snap(){return JSON.stringify({g:"pocket-metropolis",z:N,nm:s.name,m:Math.round(s.money),d:s.day,k:s.tier,t:Array.from(s.type),l:Array.from(s.lv),r:Array.from(s.tree),p:Array.from(s.pipe),q:Array.from(s.pole)})}

 try{

  var c=cars[i];
  if(!isRoad(c.x,c.y)){cars.splice(i,1);continue}
  c.t+=dt*speed*c.sp;
  if(c.t>=1){
   c.t-=1;var px=c.x,py=c.y;c.x=c.nx;c.y=c.ny;
   if(!isRoad(c.x,c.y)||!nextDir(c,px,py)){cars.splice(i,1);continue}
  }
  var k=c.t<.5?idx(c.x,c.y):idx(c.nx,c.ny);(cmap[k]=cmap[k]||[]).push(c);
 }
}
function drawCars(x,y){
 var a=cmap[idx(x,y)];if(!a)return;
 for(var i=0;i<a.length;i++){
  var c=a[i],ax=(c.x-c.y)*32,ay=(c.x+c.y)*16+16,bx=(c.nx-c.ny)*32,by=(c.nx+c.ny)*16+16,ox=c.dy*.16,oy=-c.dx*.16;
  prism(ax+(bx-ax)*c.t+(ox-oy)*32,ay+(by-ay)*c.t+(ox+oy)*16-16,.17,6,c.col,1);
 }
}
function drawTile(x,y,now){
 var i=idx(x,y),t=s.type[i],l=s.lv[i],X=(x-y)*32,Y=(x+y)*16,a;
 var sx=cam.x+X*cam.z,sy=cam.y+Y*cam.z;
 if(sx<-90*cam.z||sx>W+90*cam.z||sy<-150*cam.z||sy>H+40*cam.z)return;
 if(t===WATER){var sh=Math.sin(now/700+x*1.3+y*.9)*6;ctx.fillStyle="hsl(200,48%,"+(46+sh/2)+"%)"}
 else if(t===ROAD)ctx.fillStyle="#56626e";
 else if(t===G)ctx.fillStyle=(x+y)%2?"#86b66a":"#7fae64";
 else if(t===PARK)ctx.fillStyle="#5fae6b";
 else ctx.fillStyle=l?"#a3b48f":(x+y)%2?"#86b66a":"#7fae64";
 diamond(X,Y,1);ctx.fill();
 if(t===ROAD){
  ctx.strokeStyle="#f2d27a";ctx.lineWidth=2;ctx.setLineDash([4,4]);ctx.beginPath();
  for(var k=0;k<4;k++){var d=DX[k];if(inb(x+d[0],y+d[1])&&s.type[idx(x+d[0],y+d[1])]===ROAD){ctx.moveTo(X,Y+16);ctx.lineTo(X+d[2],Y+d[3])}}
  ctx.stroke();ctx.setLineDash([]);
 }else if(t>=R&&t<=I&&!l){
  ctx.globalAlpha=.55;ctx.fillStyle=t===R?"#f0cf79":t===C?"#6fb3e6":"#c9885a";diamond(X,Y,.86);ctx.fill();ctx.globalAlpha=1;
 }
 if(s.pole[i])pole(X,Y,i);
 if(t===G&&s.tree[i])tree(X,Y);
 else if(t===PARK){tree(X-14,Y+2);tree(X+14,Y+4);tree(X,Y-4);}
 else if(t===POW){
  prism(X,Y,.8,18,["#a7b0c0","#7f8a9e","#6a7488"],1);
  ctx.fillStyle="#555e6e";ctx.fillRect(X-12,Y-34+8,7,36);ctx.fillRect(X+6,Y-30+8,7,32);
  smoke(X-8,Y-26,now);smoke(X+10,Y-22,now+500);
 }else if(t>=8){svc(t,X,Y,now)}else if(l>0&&t>=R&&t<=I){
  var k2=t===R?SK.R:t===C?SK.C:SK.I;
  prism(X,Y,k2[1][l-1],k2[2][l-1],k2[0],k2[3][l-1]);
  if(t===I&&l>1){ctx.fillStyle="#6d6258";ctx.fillRect(X+8,Y-18,6,18);smoke(X+11,Y-14,now)}
  var np=!st.powered||!st.elec[i],nw=l>=2&&(!st.wcov[i]||!st.waterOK);if(np||nw){ctx.font="16px system-ui";ctx.textAlign="center";ctx.fillText((np?"⚡":"")+(nw?"💧":""),X,Y-k2[2][l-1]+6)}
 }
}
function draw(now){
 ctx.setTransform(dpr,0,0,dpr,0,0);
 ctx.fillStyle=view?"#2a211b":"#17414f";ctx.fillRect(0,0,W,H);
 ctx.setTransform(cam.z*dpr,0,0,cam.z*dpr,cam.x*dpr,cam.y*dpr);
 var m=N*32,n=N*16,th=16;
 ctx.fillStyle="#5b4a3a";ctx.beginPath();ctx.moveTo(-m,n);ctx.lineTo(0,N*32);ctx.lineTo(0,N*32+th);ctx.lineTo(-m,n+th);ctx.fill();
 ctx.fillStyle="#46392d";ctx.beginPath();ctx.moveTo(m,n);ctx.lineTo(0,N*32);ctx.lineTo(0,N*32+th);ctx.lineTo(m,n+th);ctx.fill();
 for(var d=0;d<2*N-1;d++)for(var x=Math.max(0,d-N+1);x<=Math.min(d,N-1);x++){ctx.globalAlpha=view?.28:1;drawTile(x,d-x,now);ctx.globalAlpha=1;if(view)drawUnder(x,d-x);else{if(tool.id==="pole"&&!s.legacy&&st.elec[idx(x,d-x)]&&s.type[idx(x,d-x)]!==WATER){ctx.fillStyle="rgba(255,213,74,.2)";diamond((x-(d-x))*32,d*16,1);ctx.fill()}drawCars(x,d-x)}}
 if(hover&&tool.id!=="pan"&&inb(hover.x,hover.y)){
  var ht=s.type[idx(hover.x,hover.y)],ok=tool.id==="bull"||(tool.layer?ht!==WATER&&(tool.id!=="pole"||ht===ROAD||ht===G):ht===G);
  ctx.strokeStyle=ok?"#f2b134":"#ff7b6b";ctx.lineWidth=3;
  diamond((hover.x-hover.y)*32,(hover.x+hover.y)*16,1);ctx.stroke();
  if(tool.r){ctx.strokeStyle="rgba(242,177,52,.85)";ctx.lineWidth=2;ctx.beginPath();for(var q=0;q<=28;q++){var an=q/28*6.2832,gx=hover.x+.5+tool.r*Math.cos(an),gy=hover.y+.5+tool.r*Math.sin(an);q?ctx.lineTo((gx-gy)*32,(gx+gy)*16):ctx.moveTo((gx-gy)*32,(gx+gy)*16)}ctx.stroke()}
 }
}
function frame(now){
 var dt=Math.min(250,now-last);last=now;
 if(speed&&inGame&&!menuOpen){acc+=dt*speed;while(acc>=1200){acc-=1200;tick()}}
 updateCars(dt);draw(now);requestAnimationFrame(frame);
}

/* ---------- input ---------- */
function resize(){
 dpr=Math.min(2,window.devicePixelRatio||1);var r=cv.getBoundingClientRect();W=r.width;H=r.height;
 cv.width=W*dpr;cv.height=H*dpr;
 if(firstSize){cam.z=W<600?.9:1;cam.x=W/2;cam.y=H/2-N*16*cam.z;firstSize=false}
}
function centerCam(){cam.z=W<600?(N>32?.55:.9):(N>32?.7:1);cam.x=W/2;cam.y=H/2-N*16*cam.z}
function tileAt(e){
 var r=cv.getBoundingClientRect(),sx=(e.clientX-r.left-cam.x)/cam.z,sy=(e.clientY-r.top-cam.y)/cam.z;
 var a=sy/16,b=sx/32;return{x:Math.floor((a+b)/2),y:Math.floor((a-b)/2)};
}
function zoomAt(px,py,nz){
 nz=Math.max(.25,Math.min(2.2,nz));
 cam.x=px-(px-cam.x)*nz/cam.z;cam.y=py-(py-cam.y)*nz/cam.z;cam.z=nz;
}
var P=new Map(),mode=null,pinch=null,pend=null;
function mid(){var v=Array.from(P.values()),r=cv.getBoundingClientRect();return{x:(v[0][0]+v[1][0])/2-r.left,y:(v[0][1]+v[1][1])/2-r.top,d:Math.hypot(v[0][0]-v[1][0],v[0][1]-v[1][1])}}
cv.addEventListener("pointerdown",function(e){
 cv.setPointerCapture(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);
 if(P.size===2){var m=mid();pinch={d:m.d,z:cam.z,x:m.x,y:m.y};mode="pinch";pend=null;return}
 if(tool.id==="pan"||e.button>0){mode="pan";return}
 mode="paint";var t=tileAt(e);hover=t;
 if(e.pointerType==="mouse")place(t.x,t.y);else pend={x:t.x,y:t.y,cx:e.clientX,cy:e.clientY};
});
cv.addEventListener("pointermove",function(e){
 var prev=P.get(e.pointerId);if(e.pointerType==="mouse")hover=tileAt(e);
 if(!prev)return;
 var dx=e.clientX-prev[0],dy=e.clientY-prev[1];P.set(e.pointerId,[e.clientX,e.clientY]);
 if(mode==="pinch"&&P.size===2){
  var m=mid();cam.x+=m.x-pinch.x;cam.y+=m.y-pinch.y;pinch.x=m.x;pinch.y=m.y;
  zoomAt(m.x,m.y,pinch.z*m.d/pinch.d);
 }else if(mode==="pan"){cam.x+=dx;cam.y+=dy}
 else if(mode==="paint"){
  if(pend){if(Math.hypot(e.clientX-pend.cx,e.clientY-pend.cy)<8)return;place(pend.x,pend.y);pend=null}
  var t=tileAt(e);hover=t;place(t.x,t.y);
 }
});
function up(e){
 if(mode==="paint"&&pend&&P.size===1)place(pend.x,pend.y);
 pend=null;P.delete(e.pointerId);if(!P.size||mode==="pinch")mode=null;

}
cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
cv.addEventListener("pointerleave",function(){if(!P.size)hover=null});

cv.addEventListener("contextmenu",function(e){e.preventDefault()});

/* ---------- toolbar ---------- */
var bar=$("bar"),EM=["👆","🛣️","🏠","🏪","🏭","🌳","⚡","🧹"];
